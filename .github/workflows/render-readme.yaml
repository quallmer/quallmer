# Checks that README.md is what README.Rmd renders to. It cannot commit the
# result itself: main only takes changes through pull requests, so a push
# from the workflow is rejected. Knit locally with `make readme` instead.
on:
  push:
    branches: [main, master]
    paths:
      - 'README.Rmd'
      - 'README.md'
      - 'DESCRIPTION'
  pull_request:
    paths:
      - 'README.Rmd'
      - 'README.md'
      - 'DESCRIPTION'

name: render-readme.yaml

permissions:
  contents: read

jobs:
  render-readme:
    runs-on: ubuntu-latest
    # Same setup-r apt exposure as the others. See #126.
    timeout-minutes: 20
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rmarkdown, any::badger

      - name: Render README.md
        run: rmarkdown::render("README.Rmd", quiet = TRUE)
        shell: Rscript {0}

      - name: Check README.md is up to date
        run: |
          if ! git diff --exit-code README.md; then
            echo "::error file=README.md::README.md is out of date with README.Rmd. Run \`make readme\` and commit the result."
            exit 1
          fi
